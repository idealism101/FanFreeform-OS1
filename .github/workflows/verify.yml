name: Verify

on:
  push:
  pull_request:

# 只读权限即可：CI 不需要写代码、回写 issue 或拿发布包。
permissions:
  contents: read

# push 与 PR 会各触发一次；同一分支只保留最新一次，避免重复排队。
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # runner 镜像自带 cmdline-tools（16.0），但不一定挂在 PATH 上。
      # 这里不用 android-actions/setup-android —— 它会去装已被 Google 下架的
      # 旧版 "tools" 包，必然报 "Failed to find package 'tools'"。
      # 改为直接解析 sdkmanager 真实路径，并写 local.properties 让 AGP 找得到 SDK。
      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found (SDK_ROOT=$SDK_ROOT)"
            exit 1
          fi
          # 镜像里的 sdkmanager 归 root 所有，runner 用户 chmod 会 "Operation not permitted"；
          # 它本来就是可执行的，所以这里必须容错，否则 set -e 会直接掐断整个步骤。
          chmod +x "$SDKMANAGER" 2>/dev/null || true
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "SDK_ROOT=$SDK_ROOT"
          echo "sdkmanager -> $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true

      - name: Install Android SDK platform
        run: |
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;35.0.0"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -1 "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found (SDK_ROOT=$SDK_ROOT)"
            exit 1
          fi
          # 镜像里的 sdkmanager 归 root 所有，runner 用户 chmod 会 "Operation not permitted"；
          # 它本来就是可执行的，所以这里必须容错，否则 set -e 会直接掐断整个步骤。
          chmod +x "$SDKMANAGER" 2>/dev/null || true
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "SDK_ROOT=$SDK_ROOT"
          echo "sdkmanager -> $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: |
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true

      - name: Install Android SDK platform
        run: |
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;35.0.0"

      # debug 包用默认 debug keystore 签名，不需要任何签名密钥。
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
